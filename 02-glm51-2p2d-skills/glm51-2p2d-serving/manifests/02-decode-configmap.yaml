apiVersion: v1
kind: ConfigMap
metadata:
  name: sglang-decode-launcher
  namespace: glm51-test
data:
  launcher.sh: |
    #!/usr/bin/env bash
    set -eu

    # Fix nixl module name (image has nixl_cu13, SGLang expects nixl)
    NIXL_DIR="/opt/nixl/lib/python3/dist-packages"
    if [ ! -d "${NIXL_DIR}/nixl_cu13" ]; then
      echo "[Decode] ERROR: nixl_cu13 not found at ${NIXL_DIR}"
      ls -la "${NIXL_DIR}"
      exit 1
    fi
    ln -sf "${NIXL_DIR}/nixl_cu13" "${NIXL_DIR}/nixl"
    echo "[Decode] Created symlink: ${NIXL_DIR}/nixl -> nixl_cu13"
    python3 -c "from nixl._api import nixl_agent; print('[Decode] SUCCESS: nixl import works')" || exit 1

    # Required environment variables
    MODEL_PATH="${MODEL_PATH:-/data/models/GLM-5.1-FP8}"
    POD_NAME="${POD_NAME:?}"
    POD_NAMESPACE="${POD_NAMESPACE:?}"
    NODE_RANK=$(echo $POD_NAME | grep -oE '[0-9]+$')

    # Distributed config
    NNODES="${NNODES:-2}"
    MASTER_ADDR="${MASTER_ADDR:-sglang-decode-0.sglang-decode.glm51-test.svc.cluster.local}"
    MASTER_PORT="${MASTER_PORT:-5757}"
    KV_BACKEND="${KV_BACKEND:-nixl}"

    # EFA device discovery
    if command -v fi_info >/dev/null 2>&1; then
      IB_DEVICES=$(fi_info -p efa 2>/dev/null | awk '/domain:/ {print $2}' | sed 's/-rdm$//;s/-dgrm$//' | sort -u | paste -sd,)
      echo "[Decode-${NODE_RANK}] Discovered EFA devices: ${IB_DEVICES}"
    else
      IB_DEVICES="rdmap85s0,rdmap86s0,rdmap110s0,rdmap111s0,rdmap135s0,rdmap136s0,rdmap160s0,rdmap161s0,rdmap87s0,rdmap88s0,rdmap112s0,rdmap113s0,rdmap137s0,rdmap138s0,rdmap162s0,rdmap163s0"
      echo "[Decode-${NODE_RANK}] Using default EFA devices: ${IB_DEVICES}"
    fi

    # Restore DeepGEMM cache from S3 if local is empty
    S3_CACHE_PATH="s3://${S3_BUCKET:?S3_BUCKET env required}/cache/deep_gemm/${POD_NAME}"
    LOCAL_CACHE="/data/sglang/deep_gemm"
    mkdir -p "${LOCAL_CACHE}"
    EXISTING_FILES=$(find "${LOCAL_CACHE}" -type f 2>/dev/null | wc -l)
    if [ "${EXISTING_FILES}" -eq 0 ]; then
      echo "[Decode-${NODE_RANK}] Local cache empty, restoring from ${S3_CACHE_PATH} ..."
      if aws s3 sync "${S3_CACHE_PATH}/" "${LOCAL_CACHE}/" --region "${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION env required}" --only-show-errors; then
        echo "[Decode-${NODE_RANK}] Cache restored: $(find ${LOCAL_CACHE} -type f | wc -l) files"
      else
        echo "[Decode-${NODE_RANK}] S3 cache not available, will compile from scratch"
      fi
    else
      echo "[Decode-${NODE_RANK}] Local cache has ${EXISTING_FILES} files, skip S3 restore"
    fi

    # Environment setup
    export NVIDIA_SPARSE_ENABLE=1
    export SGLANG_SET_CPU_AFFINITY=1
    export SGLANG_ENABLE_JIT_DEEPGEMM=1
    export SGLANG_JIT_DEEPGEMM_COMPILE_WORKERS=32
    export SGLANG_DG_CACHE_DIR=/data/sglang/deep_gemm
    export PYTHONUNBUFFERED=1
    export SGLANG_DISAGGREGATION_HEARTBEAT_INTERVAL=10
    export SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT=300
    export SGLANG_DISAGGREGATION_WAITING_TIMEOUT=300
    export UCCL_IB_MAX_INFLIGHT_LOW_LATENCY=128
    export SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK=128
    export UCCL_SOCKET_IFNAME=eth0
    export UCCL_IB_HCA="${IB_DEVICES}"
    # export UCCL_IB_HCA=rdmap85s0,rdmap86s0,rdmap110s0,rdmap111s0,rdmap135s0,rdmap136s0,rdmap160s0,rdmap161s0
    # export FI_EFA_IFACE=rdmap87s0,rdmap88s0,rdmap112s0,rdmap113s0,rdmap137s0,rdmap138s0,rdmap162s0,rdmap163s0

    # nixl environment
    export FI_PROVIDER=efa
    export FI_EFA_USE_DEVICE_RDMA=1
    export FI_EFA_FORK_SAFE=1
    export SGLANG_DISAGGREGATION_NIXL_BACKEND=LIBFABRIC

    # Create cache directories
    mkdir -p /data/sglang/torch-compile
    mkdir -p /data/sglang/deep_gemm
    mkdir -p /data/sglang/logs

    echo "[Decode-${NODE_RANK}] Starting SGLang decode server..."
    echo "[Decode-${NODE_RANK}] Node rank: ${NODE_RANK}/${NNODES}"
    echo "[Decode-${NODE_RANK}] Master: ${MASTER_ADDR}:${MASTER_PORT}"
    echo "[Decode-${NODE_RANK}] Model: ${MODEL_PATH}"
    echo "[Decode-${NODE_RANK}] KV backend: ${KV_BACKEND}"

    exec python3 -m sglang.launch_server \
      --model-path "${MODEL_PATH}" \
      --served-model-name glm-5-fp8-long-pd \
      --enable-metrics \
      --log-level info \
      --watchdog-timeout 1200 \
      --decode-log-interval 200 \
      --disaggregation-mode decode \
      --disaggregation-transfer-backend "${KV_BACKEND}" \
      --disaggregation-bootstrap-port 5555 \
      --disaggregation-ib-device "${IB_DEVICES}" \
      --host 0.0.0.0 \
      --port 30081 \
      --trust-remote-code \
      --tp-size 16 \
      --dp-size 16 \
      --nnodes ${NNODES} \
      --node-rank ${NODE_RANK} \
      --dist-init-addr "${MASTER_ADDR}:${MASTER_PORT}" \
      --enable-dp-attention \
      --moe-dense-tp-size 1 \
      --enable-dp-lm-head \
      --ep-dispatch-algorithm dynamic \
      --eplb-algorithm deepseek \
      --disable-shared-experts-fusion \
      --deepep-mode low_latency \
      --mem-fraction-static 0.74 \
      --cuda-graph-max-bs 16 \
      --max-running-requests 256 \
      --context-length 202752 \
      --moe-a2a-backend deepep \
      --prefill-round-robin-balance \
      --tokenizer-worker-num 8 \
      --enable-dynamic-batch-tokenizer \
      --dynamic-batch-tokenizer-batch-size 8 \
      --attention-backend nsa \
      --page-size 64 \
      --speculative-algorithm EAGLE \
      --speculative-num-steps 3 \
      --speculative-eagle-topk 1 \
      --speculative-num-draft-tokens 4 \
      --crash-dump-folder /data/sglang/logs \
      --tool-call-parser glm47 \
      --reasoning-parser glm45
